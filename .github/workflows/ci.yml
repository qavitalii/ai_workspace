name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
          POSTGRES_DB: workspace
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U workspace"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          INTEGRATION_TESTS: "1"
          DATABASE_URL: postgres://workspace:workspace@127.0.0.1:54329/workspace
      - run: for script in ops/*.sh; do bash -n "$script"; done
      - name: Validate domain, IP and local proxy configurations offline
        run: CADDY_TESTS=1 COMPOSE_TESTS=1 npx vitest run tests/deployment.test.ts
      - name: Test IP HTTPS and WebSocket connections without a public CA
        run: |
          caddy_image=$(node --input-type=module -e 'import fs from "node:fs"; console.log(fs.readFileSync("compose.yaml", "utf8").match(/image: (caddy:[^\s]+)/)[1])')
          proxy_container=$(docker create "$caddy_image")
          trap 'docker rm "$proxy_container" >/dev/null' EXIT
          docker cp "$proxy_container:/usr/bin/caddy" "$RUNNER_TEMP/workspace-test-caddy"
          CADDY_BIN="$RUNNER_TEMP/workspace-test-caddy" CADDY_HTTPS_TESTS=1 npx vitest run tests/ip-https.test.ts
      - run: docker build --target server .
